services:
  mongo:
    image: mongo:7
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - imovies_mongo:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --eval "try { quit(rs.status().ok ? 0: 1) } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}); quit(1) }"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
volumes:
  imovies_mongo:
